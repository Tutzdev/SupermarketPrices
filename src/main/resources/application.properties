spring.application.name=prices
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.shutdown=graceful
app.auth.token-ttl=${AUTH_TOKEN_TTL:PT12H}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.prices.max-age=${PRICE_MAX_AGE:P2D}
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
