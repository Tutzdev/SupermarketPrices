services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: prices
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prices_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d prices"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  prices_postgres:
